# D134 Phase 6 — MySQL 8 fixture for integration_test.ss.
# D135 Phase 2 supersedes: the legacy `--default-authentication-plugin` command
# override is removed; MySQL 8 default plugin `caching_sha2_password` takes over
# and the SS driver speaks the fast-path direct mode (D135 §A.1 / §A.3).
#
# The mysqladmin healthcheck runs `--protocol=TCP -h 127.0.0.1` (NOT the unix
# socket) so it reaches `root@%` — the same MySQL account the SS driver uses.
# mysqladmin implements full caching_sha2_password (0x04 perform_full_auth →
# 0x02 request public key → RSA-OAEP encrypt → 0x05 send encrypted password),
# so the first healthcheck round populates the server-side cache for `root@%`.
# After `docker compose up -d --wait` returns, the cache is warm and SS TCP
# connects land on fast_auth_success (0x01 0x03) single-RTT — no RSA-OAEP on
# the SS side. (root@localhost via unix socket would populate a different
# account's cache and would NOT help.)
#
# Bind 3307 (not 3306) so a host-level mysql:8 (e.g. jarvis-mysql) on 3306
# does not collide. integration_test.ss connects to 127.0.0.1:3307.
#
# Bring up:    docker compose -f tests/d134_mysql/docker-compose.yml up -d --wait
# Tear down:   docker compose -f tests/d134_mysql/docker-compose.yml down -v

services:
  testss-mysql:
    image: mysql:8.0
    container_name: testss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    command:
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-ptest"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
